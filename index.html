<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">

<title>Darb · درب</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
:root{--bg:#f6f7f9;--fg:#15171a;--mut:#666b73;--line:rgba(0,0,0,.09);--card:#fff;--chip:#eef0f3;--acc:#1a73e8;--sheet-h:0px}
body.dark{--bg:#0f1114;--fg:#eceef1;--mut:#9aa0a8;--line:rgba(255,255,255,.1);--card:#1c1f24;--chip:#2a2e35;--acc:#4c8dff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
#map{position:fixed;inset:0;background:var(--bg);direction:ltr}
.dark.osm .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.leaflet-bottom,.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:var(--sheet-h)}
.maplibregl-popup-content{background:var(--card);color:var(--fg);border-radius:12px;padding:10px 14px;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.maplibregl-popup-tip{display:none}
.maplibregl-popup-close-button{color:var(--mut);font-size:18px;padding:0 6px}
[dir=rtl] .maplibregl-popup-content{direction:rtl;text-align:right}
.dark .maplibregl-ctrl-attrib{background:rgba(20,22,26,.8)!important;color:#aaa}
.dark .maplibregl-ctrl-attrib a{color:#8ab4ff}
.dark .maplibregl-ctrl-attrib-button{filter:invert(1)}
.leaflet-control-attribution{font-size:10px}
.dark .leaflet-control-attribution{background:rgba(20,22,26,.8)!important;color:#aaa}
.dark .leaflet-control-attribution a{color:#8ab4ff}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--card);color:var(--fg)}
[dir=rtl] .leaflet-popup-content{direction:rtl;text-align:right}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.18)}
#top{position:fixed;top:0;inset-inline:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;z-index:1000;pointer-events:none}
#top>*{pointer-events:auto}
.bar{display:flex;align-items:center;gap:6px;height:50px;padding-inline:14px 6px}
.bar>.ti{font-size:20px;color:var(--mut)}
#q{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--fg);font-size:16px;height:100%}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:21px;color:var(--mut);flex:none}
.ib:active{background:var(--chip)}
#results{margin-top:8px;max-height:55vh;overflow:auto}
.it{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:start;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it>.ti{font-size:20px;color:var(--mut);flex:none}
.it>div{min-width:0;flex:1}
.it b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it small{display:block;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .d{flex:none;color:var(--mut);font-size:13px}
.msg{padding:14px;color:var(--mut)}
#chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--card);box-shadow:0 1px 6px rgba(0,0,0,.15);font-size:14px;font-weight:500}
.chip .ti{font-size:18px;color:var(--acc)}
#banner{position:fixed;top:calc(env(safe-area-inset-top) + 10px);inset-inline:10px;z-index:1000;background:#0f6e56;color:#fff;border-radius:16px;padding:12px 14px;display:flex;gap:14px;align-items:center;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.mi{display:flex;flex-direction:column;align-items:center;min-width:64px}
.mi .ti{font-size:40px;line-height:1}
#bd{font-size:17px;font-weight:700;margin-top:2px;white-space:nowrap}
#btext{font-size:19px;font-weight:600;line-height:1.25}
#bnext{font-size:13px;opacity:.85;margin-top:4px}
#spd{position:fixed;inset-inline-start:12px;bottom:calc(max(var(--sheet-h),env(safe-area-inset-bottom)) + 28px);z-index:900;width:64px;height:64px;border-radius:50%;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.25);display:flex;flex-direction:column;align-items:center;justify-content:center}
#spv{font-size:22px;font-weight:700;line-height:1}
#spd .u{font-size:10px;color:var(--mut)}
#spd.over{background:#e03131;color:#fff}
#spd.over .u{color:#fff}
#lim{position:absolute;top:-10px;inset-inline-end:-12px;width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid #e03131;color:#111;font-weight:700;font-size:13px;display:grid;place-items:center}
#fabs{position:fixed;inset-inline-end:12px;bottom:calc(max(var(--sheet-h),env(safe-area-inset-bottom)) + 28px);z-index:900;display:flex;flex-direction:column;gap:12px}
.fab{width:52px;height:52px;border-radius:50%;background:var(--card);box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center;font-size:24px}
.fab.rep{background:#f08c00;color:#fff}
#sheet{position:fixed;inset-inline:0;bottom:0;z-index:1001;background:var(--card);border-radius:20px 20px 0 0;box-shadow:0 -2px 14px rgba(0,0,0,.2);padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:70vh;overflow:auto}
.ph{display:flex;align-items:flex-start;gap:10px}
.ph>div{flex:1;min-width:0}
.pn{font-size:19px;font-weight:700}
.pa{color:var(--mut);font-size:14px;margin-top:2px}
.h{font-size:18px;font-weight:700;flex:1;padding-top:8px}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{height:46px;padding:0 18px;border-radius:23px;background:var(--chip);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--acc);color:#fff;flex:1}
.btn.red{background:#e03131;color:#fff}
.btn .ti{font-size:20px}
.lnk{color:var(--acc);font-weight:500;padding:6px 2px}
.rt{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border-radius:12px;border:2px solid transparent;text-align:start;margin-bottom:6px;background:var(--chip)}
.rt.sel{border-color:var(--acc)}
.rt b{font-size:18px}
.badge{font-size:11px;font-weight:700;background:#d3f9d8;color:#1a7f37;padding:2px 8px;border-radius:10px}
.st{display:flex;justify-content:space-around;text-align:center}
.st b{display:block;font-size:20px}
.st small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.rb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:14px;background:var(--chip);font-weight:600;font-size:13px;text-align:center}
.rb i{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:26px}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;height:36px;border-radius:9px;font-weight:600;font-size:14px}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.15)}
.set{margin-top:14px}
.set>label{display:block;font-size:13px;color:var(--mut);margin-bottom:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 140px);z-index:2000;background:rgba(20,22,26,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;max-width:88vw;text-align:center}
.me-wrap{width:28px;height:28px;position:relative}
.me-dot{position:absolute;inset:4px;border-radius:50%;background:var(--acc);border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.norot .me-arrow{display:none}
#northBtn i{transition:transform .15s}
.me-arrow{position:absolute;left:7px;top:-9px;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:12px solid var(--acc)}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;background:#e03131;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.repm{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:18px;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.4)}
.acct{display:flex;align-items:center;gap:10px}
.acct img,.acct>.ti{width:40px;height:40px;border-radius:50%;font-size:40px;color:var(--mut);flex:none}
.acct>div{flex:1;min-width:0}
.acct b,.acct small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct small{color:var(--mut)}
.poi{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--acc);color:#fff;font-size:16px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div class="bar card">
    <i class="ti ti-search"></i>
    <input id="q" type="text" autocomplete="off" enterkeyhint="search" data-tp="search">
    <button class="ib" id="qx" data-act="clearq" aria-label="Clear" hidden><i class="ti ti-x"></i></button>
    <button class="ib" data-act="settings" aria-label="Settings"><i class="ti ti-settings"></i></button>
  </div>
  <div id="results" class="card" hidden></div>
  <div id="chips">
    <button class="chip" data-act="favgo" data-k="home"><i class="ti ti-home"></i><span data-t="home"></span></button>
    <button class="chip" data-act="favgo" data-k="work"><i class="ti ti-briefcase"></i><span data-t="work"></span></button>
    <button class="chip" data-act="near" data-k="fuel"><i class="ti ti-gas-station"></i><span data-t="fuel"></span></button>
    <button class="chip" data-act="near" data-k="parking"><i class="ti ti-parking"></i><span data-t="parking"></span></button>
    <button class="chip" data-act="near" data-k="hospital"><i class="ti ti-building-hospital"></i><span data-t="hospital"></span></button>
    <button class="chip" data-act="near" data-k="atm"><i class="ti ti-building-bank"></i><span data-t="atm"></span></button>
  </div>
</div>

<div id="banner" hidden>
  <div class="mi"><i id="bi" class="ti ti-arrow-up"></i><div id="bd"></div></div>
  <div><div id="btext"></div><div id="bnext"></div></div>
</div>

<div id="spd"><div id="lim" hidden></div><div id="spv">0</div><div class="u" data-t="kmh"></div></div>

<div id="fabs">
  <button class="fab" id="northBtn" data-act="north" aria-label="North" hidden><i class="ti ti-navigation-north"></i></button>
  <button class="fab" data-act="voice" aria-label="Voice"><i id="volI" class="ti ti-volume"></i></button>
  <button class="fab" data-act="recenter" aria-label="Recenter"><i class="ti ti-current-location"></i></button>
  <button class="fab rep" data-act="report" aria-label="Report"><i class="ti ti-alert-triangle"></i></button>
</div>

<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/supabase/supabase.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
const LS={get(k,d){try{const v=localStorage.getItem('darb.'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('darb.'+k,JSON.stringify(v))}catch(e){}}};
const S=Object.assign({lang:/^ar/i.test(navigator.language||'')?'ar':'en',voice:true,night:'auto',share:true,map3d:true},LS.get('settings',{}));

let recents=LS.get('recents',[]),reports=LS.get('reports',[]);
const saveS=()=>LS.set('settings',S),saveP=()=>LS.set('places',P);

const I18N={

};
const t=(k,...a)=>{const v=(I18N[S.lang]||I18N.en)[k]??I18N.en[k]??k;return typeof v==='function'?v(...a):v};
const AR=()=>S.lang==='ar';
const loc=()=>AR()?'ar-IQ':'en-GB';
const nf=(n,d=0)=>Number(n).toLocaleString(loc(),{maximumFractionDigits:d});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lc=s=>AR()?s:s.charAt(0).toLowerCase()+s.slice(1);

const RAD=Math.PI/180,ER=6371000;
function dist(a,b){const dLa=(b[0]-a[0])*RAD,dLo=(b[1]-a[1])*RAD;const h=Math.sin(dLa/2)**2+Math.cos(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.sin(dLo/2)**2;return 2*ER*Math.asin(Math.min(1,Math.sqrt(h)))}
function bearing(a,b){const y=Math.sin((b[1]-a[1])*RAD)*Math.cos(b[0]*RAD),x=Math.cos(a[0]*RAD)*Math.sin(b[0]*RAD)-Math.sin(a[0]*RAD)*Math.cos(b[0]*RAD)*Math.cos((b[1]-a[1])*RAD);return(Math.atan2(y,x)/RAD+360)%360}
function projSeg(p,a,b){const k=Math.cos(p[0]*RAD),ax=(a[1]-p[1])*k,ay=a[0]-p[0],dx=(b[1]-a[1])*k,dy=b[0]-a[0],q=dx*dx+dy*dy;let u=q?-(ax*dx+ay*dy)/q:0;u=Math.max(0,Math.min(1,u));return{t:u,d:dist(p,[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u])}}
const same=(a,b)=>!!(a&&b)&&dist([a.lat,a.lng],[b.lat,b.lng])<30;

function fmtDist(m){if(m<1000){const r=m<100?Math.round(m/10)*10:Math.round(m/50)*50;return nf(r)+' '+t('m')}return nf(m/1000,m<10000?1:0)+' '+t('km')}
function fmtDur(s){const mn=Math.max(1,Math.round(s/60));if(mn<60)return nf(mn)+' '+t('min');return nf(Math.floor(mn/60))+' '+t('h')+' '+nf(mn%60)+' '+t('min')}
const clock=s=>new Date(Date.now()+s*1000).toLocaleTimeString(loc(),{hour:'2-digit',minute:'2-digit'});
async function fetchT(url,ms=10000,opt={}){const c=new AbortController(),id=setTimeout(()=>c.abort(),ms);try{return await fetch(url,{...opt,signal:c.signal})}finally{clearTimeout(id)}}
let tT=null;function toast(m,ms=2500){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(tT);tT=setTimeout(()=>el.hidden=true,ms)}

// ── Platform: inside the Android app (Capacitor) or a normal browser ──
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const plugin=n=>NATIVE&&Capacitor.registerPlugin?Capacitor.registerPlugin(n):null;
const TTS=plugin('TextToSpeech'),KEEP=plugin('KeepAwake'),APP=plugin('App'),BROWSER=plugin('Browser');

  const out=(j.features||[]).map(f=>{const p=f.properties||{};const name=p.name||[p.street,p.housenumber].filter(Boolean).join(' ')||p.city||'';const addr=[p.name?p.street:null,p.district||p.locality,p.city,p.state].filter((v,i,a)=>v&&v!==name&&a.indexOf(v)===i).join(sp);return{name,addr,lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0]}}).filter(p=>p.name);

const ROUTERS=['https://routing.openstreetmap.de/routed-car/route/v1/driving/','https://router.project-osrm.org/route/v1/driving/'];
function prepRoute(r){
 const ll=r.geometry.coordinates.map(c=>[c[1],c[0]]),cum=[0];for(let i=1;i<ll.length;i++)cum[i]=cum[i-1]+dist(ll[i-1],ll[i]);
 const steps=r.legs.flatMap(l=>l.steps);let j=0;
 const sa=steps.map(s=>{const m=[s.maneuver.location[1],s.maneuver.location[0]];let bi=j,bd=Infinity;for(let i=j;i<ll.length;i++){const d=dist(m,ll[i]);if(d<bd){bd=d;bi=i}if(bd<1||(bd<30&&d>bd+500))break}j=bi;return cum[bi]});
 const v=[...steps].sort((a,b)=>b.distance-a.distance).find(s=>s.name||s.ref);
 return{ll,cum,steps,sa,total:cum[cum.length-1]||1,dur:r.duration,dist:r.distance,via:v?(v.name||v.ref):''};
}
async function fetchRoutes(a,b,head){
 const path=`${a[1].toFixed(6)},${a[0].toFixed(6)};${b[1].toFixed(6)},${b[0].toFixed(6)}`;
 const q='?overview=full&geometries=geojson&steps=true&alternatives=true'+(head!=null?`&bearings=${Math.round(head)%360},60;`:'');
 for(const base of ROUTERS){try{const r=await fetchT(base+path+q,15000);const j=await r.json();if(j.code==='Ok'&&j.routes&&j.routes.length)return j.routes.map(x=>prepRoute(x))}catch(e){}}
 if(head!=null)return fetchRoutes(a,b,null);
 throw new Error('noroute');
}

const DIR_EN=['north','northeast','east','southeast','south','southwest','west','northwest'];
const DIR_AR=['الشمال','الشمال الشرقي','الشرق','الجنوب الشرقي','الجنوب','الجنوب الغربي','الغرب','الشمال الغربي'];
const ORD_EN=['','first','second','third','fourth','fifth','sixth','seventh','eighth','ninth','tenth'];
const ORD_AR=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر'];
const TURN_EN={uturn:'Make a U-turn','sharp right':'Turn sharp right',right:'Turn right','slight right':'Bear right',straight:'Continue straight','slight left':'Bear left',left:'Turn left','sharp left':'Turn sharp left'};
const TURN_AR={uturn:'استدر للخلف','sharp right':'انعطف بحدة يمينًا',right:'انعطف يمينًا','slight right':'انحرف يمينًا',straight:'تابع للأمام','slight left':'انحرف يسارًا',left:'انعطف يسارًا','sharp left':'انعطف بحدة يسارًا'};
function instr(s){
 const m=s.maneuver,ty=m.type,mod=m.modifier||'straight',name=s.name||s.ref||'';
 const side=/left/.test(mod)?'left':/right/.test(mod)?'right':'',dir=Math.round((m.bearing_after||0)/45)%8;
 if(AR()){
  const on=name?` إلى ${name}`:'',turn=TURN_AR[mod]||TURN_AR.straight,sd=side==='left'?'اليسار':side==='right'?'اليمين':'';
  switch(ty){
   case 'depart':return`اتجه نحو ${DIR_AR[dir]}`+(name?` على ${name}`:'');
   case 'arrive':return'لقد وصلت إلى وجهتك'+(sd?`، على ${sd}`:'');
   case 'merge':return(sd?`اندمج إلى ${sd}`:'اندمج')+on;
   case 'on ramp':return(sd?`اسلك المنحدر على ${sd}`:'اسلك المنحدر')+on;
   case 'off ramp':return(sd?`اسلك المخرج على ${sd}`:'اسلك المخرج')+on;
   case 'fork':return(sd?`عند التفرع، الزم ${sd}`:'عند التفرع، تابع للأمام')+on;
   case 'end of road':return`في نهاية الطريق، ${turn}`+on;
   case 'roundabout':case 'rotary':return(m.exit&&ORD_AR[m.exit]?`عند الفلكة، اسلك المخرج ${ORD_AR[m.exit]}`:'ادخل الفلكة')+on;
   case 'roundabout turn':return`عند الفلكة، ${turn}`+on;
   case 'exit roundabout':case 'exit rotary':return'اخرج من الفلكة'+on;
   case 'new name':case 'continue':case 'notification':return(mod==='straight'?'تابع':turn)+on;
   default:return turn+on;
  }
 }
 const on=name?` onto ${name}`:'',turn=TURN_EN[mod]||TURN_EN.straight;
 switch(ty){
  case 'depart':return`Head ${DIR_EN[dir]}`+(name?` on ${name}`:'');
  case 'arrive':return'You have arrived'+(side?`, on the ${side}`:'');
  case 'merge':return'Merge'+(side?` ${side}`:'')+on;
  case 'on ramp':return'Take the ramp'+(side?` on the ${side}`:'')+on;
  case 'off ramp':return'Take the exit'+(side?` on the ${side}`:'')+on;
  case 'fork':return(side?`Keep ${side} at the fork`:'Continue at the fork')+on;
  case 'end of road':return`At the end of the road, ${lc(turn)}`+on;
  case 'roundabout':case 'rotary':return(m.exit&&ORD_EN[m.exit]?`At the roundabout, take the ${ORD_EN[m.exit]} exit`:'Enter the roundabout')+on;
  case 'roundabout turn':return`At the roundabout, ${lc(turn)}`+on;
  case 'exit roundabout':case 'exit rotary':return'Exit the roundabout'+on;
  case 'new name':case 'continue':case 'notification':return(mod==='straight'?'Continue':turn)+on;
  default:return turn+on;
 }
}
function inDist(d,txt){let n;if(d>=1000){const km=Math.round(d/100)/10;n=AR()?`${km} كيلومتر`:`${km} kilometer${km===1?'':'s'}`}else{const r=d<100?Math.round(d/10)*10:Math.round(d/50)*50;n=AR()?`${r} متر`:`${r} meters`}return AR()?`بعد ${n}، ${txt}`:`In ${n}, ${lc(txt)}`}
function mIcon(s){const ty=s.maneuver.type,m=s.maneuver.modifier||'straight';if(ty==='arrive')return'ti-flag';if(/roundabout|rotary/.test(ty))return'ti-rotate';if(/ramp|fork|merge/.test(ty)){if(/left/.test(m))return'ti-arrow-ramp-left';if(/right/.test(m))return'ti-arrow-ramp-right';return'ti-arrow-up'}return{uturn:'ti-arrow-back-up','sharp right':'ti-arrow-sharp-turn-right',right:'ti-arrow-right','slight right':'ti-arrow-bear-right',straight:'ti-arrow-up','slight left':'ti-arrow-bear-left',left:'ti-arrow-left','sharp left':'ti-arrow-sharp-turn-left'}[m]||'ti-arrow-up'}

const nav={active:false,r:null,idx:0,k:1,spoken:{},off:0,lastRe:0,repA:{},along:0,onroute:false,startP:null};
function snapTo(r,p,full){const c=r.ll;let lo=0,hi=c.length-1;if(!full){lo=Math.max(0,nav.idx-15);hi=Math.min(c.length-1,nav.idx+400)}let b={d:Infinity,i:0,t:0};for(let i=lo;i<hi;i++){const s=projSeg(p,c[i],c[i+1]);if(s.d<b.d)b={d:s.d,i,t:s.t}}if(!full&&b.d>60){const f=snapTo(r,p,true);if(f.d<b.d)b=f}return b}
const alongOf=(r,s)=>r.cum[s.i]+s.t*((r.cum[s.i+1]??r.cum[s.i])-r.cum[s.i]);
function setNavRoute(r){Object.assign(nav,{r,idx:0,k:1,spoken:{},off:0,along:0,repA:{},onroute:false,startP:me});indexReports(r)}

 speak(txt);navUpdate();
}
function navUpdate(){
 const r=nav.r;if(!r||!me)return;
 const s=snapTo(r,me,false);nav.idx=s.i;const along=alongOf(r,s);nav.along=along;
 const offLim=Math.max(45,Math.min(meAcc||0,80)*1.3);if(s.d<30)nav.onroute=true;
 if(s.d>offLim&&(nav.onroute||dist(nav.startP||me,me)>80)){if(++nav.off>=3&&Date.now()-nav.lastRe>12000)reroute()}else nav.off=0;
 let k=nav.k;while(k<r.steps.length-1&&r.sa[k]<=along+5)k++;nav.k=k;
 const dNext=Math.max(0,r.sa[k]-along),rem=Math.max(0,r.total-along);
 renderBanner(k,dNext);renderNavNums(rem);voiceFor(k,dNext);navReportAlerts();
 if(s.d<60&&(rem<25||(k===r.steps.length-1&&dNext<25)))arrive();
}
function voiceFor(k,d){
 const r=nav.r,s=r.steps[k],sp=nav.spoken[k]||(nav.spoken[k]={});const v=Math.max(meSpeed,8),far=v>20?1500:800,nearT=v>20?500:250,now=Math.max(35,v*3.2),gap=r.sa[k]-r.sa[k-1];
 if(d<=now){if(!sp.now&&s.maneuver.type!=='arrive'){sp.now=sp.near=sp.far=1;let txt=instr(s);const n=r.steps[k+1];if(n&&r.sa[k+1]-r.sa[k]<150){txt+=(AR()?'، ثم ':', then ')+lc(instr(n));nav.spoken[k+1]={far:1,near:1}}speak(txt)}}
 else if(d<=nearT){if(!sp.near&&gap>now*2){sp.near=sp.far=1;speak(inDist(d,instr(s)))}}
 else if(d<=far){if(!sp.far&&gap>far*1.3){sp.far=1;speak(inDist(d,instr(s)))}}
}

function freeAlerts(){if(!me||meSpeed<5||meHead==null)return;for(const x of activeReports()){if(alerted.has(x.id))continue;const p=[x.lat,x.lng];if(dist(me,p)>350)continue;let df=Math.abs(bearing(me,p)-meHead)%360;if(df>180)df=360-df;if(df<35){alerted.add(x.id);alertReport(x)}}}

// ── Live traffic ──
// While driving and signed in (and sharing is on), every 10 s send the average speed over the last ~60 s.
// Averaging keeps a short stop at a red light from looking like a jam. Sampling stops 3 min after the car last moved.
const trafIdx=new Map(),trail=[],tq=[];
let lastSampleT=0,lastFastT=0,trafT=0,trafBusy=false,repT=0,repBusy=false;
function sampleTraffic(){
 const now=Date.now();if(!me)return;if(meSpeed>4.2)lastFastT=now;
 trail.push({t:now,p:me});while(trail.length&&now-trail[0].t>90000)trail.shift();
 if(!CLOUD||!user||!S.share||meAcc>40||now-lastFastT>180000||now-lastSampleT<10000)return;
 const o=trail[0];if(!o||now-o.t<45000)return;
 const d=dist(o.p,me),hd=d>30?bearing(o.p,me):meHead;if(hd==null)return;
 lastSampleT=now;tq.push({lat:+me[0].toFixed(5),lng:+me[1].toFixed(5),speed:+(d/((now-o.t)/1000)*3.6).toFixed(1),heading:Math.round(hd)});
 if(tq.length>300)tq.splice(0,tq.length-300);
}
async function flushTraffic(){if(!CLOUD||!user||!tq.length||!navigator.onLine)return;const batch=tq.splice(0,60);
 try{const {error}=await sb.rpc('submit_traffic',{samples:batch});if(error)throw error}catch(e){if(tq.length<240)tq.unshift(...batch)}}
// 0 = flowing, 1 = slow, 2 = jam. Uses the "usual speed" ratio when the server has enough history for that spot.
function trafLevel(r){if(r.ratio!=null)return r.ratio<.35?2:r.ratio<.65?1:0;return r.speed<10?2:r.speed<25?1:0}
const cellKey=(lat,lng,hb)=>Math.floor(lat/0.0015)+','+Math.floor(lng/0.0015)+','+hb;
function drawTraffic(rows){
 trafIdx.clear();const worst={};
 for(const r of rows){if(r.n<2)continue;const lv=trafLevel(r);if(!lv)continue;trafIdx.set(cellKey(r.lat,r.lng,r.hb),lv);const k=r.lat.toFixed(5)+','+r.lng.toFixed(5);if(!worst[k]||lv>worst[k].lv)worst[k]={lv,lat:r.lat,lng:r.lng}}
 M.traffic(Object.values(worst));
 if(routes.length)drawRoutes();
}
function trafAt(lat,lng,hd){const hb=Math.round((((hd%360)+360)%360)/45)%8;let best=0;for(const h of [hb,(hb+1)%8,(hb+7)%8]){const v=trafIdx.get(cellKey(lat,lng,h))||0;if(v>best)best=v}return best}
// Stretches of the route that pass slow (1) or jammed (2) cells in the direction of travel.
function routeRuns(r){const out=[];let run=null,lv0=0;const flush=()=>{if(run&&run.length>1)out.push({ll:run,lv:lv0})};
 for(let i=0;i<r.ll.length-1;i++){const a=r.ll[i],b=r.ll[i+1],lv=trafAt((a[0]+b[0])/2,(a[1]+b[1])/2,bearing(a,b));if(lv!==lv0){flush();run=lv?[a]:null;lv0=lv}if(lv)run.push(b)}flush();return out}
const box=pad=>{const b=M.bounds(pad);return{min_lat:b.s,min_lng:b.w,max_lat:b.n,max_lng:b.e}};
async function loadTraffic(force){if(!CLOUD)return;if(M.zoom()<11){M.traffic([]);trafIdx.clear();return}
 if(trafBusy||(!force&&Date.now()-trafT<45000))return;trafBusy=true;trafT=Date.now();
 try{const {data,error}=await sb.rpc('get_traffic',box(.3));if(error)throw error;drawTraffic(data||[])}catch(e){}finally{trafBusy=false}}
async function loadReports(force){if(!CLOUD||M.zoom()<9)return;if(repBusy||(!force&&Date.now()-repT<45000))return;repBusy=true;repT=Date.now();
 try{const {data,error}=await sb.rpc('get_reports',box(.5));if(error)throw error;
  reports=reports.filter(x=>!x.remote).concat((data||[]).filter(r=>RT[r.type]).map(r=>({id:r.id,type:r.type,lat:r.lat,lng:r.lng,t:Date.parse(r.created_at),remote:true,mine:!!r.mine})));
  drawReports();if(nav.active&&nav.r)indexReports(nav.r)}catch(e){}finally{repBusy=false}}

// ── Google sign-in (Supabase). Web: full-page redirect back here. APK: system browser, then back via darb://auth ──
async function signIn(){if(!CLOUD)return;
 try{if(NATIVE){const {data,error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:AUTH_REDIRECT_APP,skipBrowserRedirect:true,queryParams:{prompt:'select_account'}}});if(error)throw error;await BROWSER.open({url:data.url})}
  else{const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname,queryParams:{prompt:'select_account'}}});if(error)throw error}}
 catch(e){toast(t('signInFail'))}}
async function finishAppSignIn(url){if(!CLOUD||!url||url.indexOf(AUTH_REDIRECT_APP)!==0)return;if(BROWSER)BROWSER.close().catch(()=>{});
 const q=new URL(url.replace(AUTH_REDIRECT_APP,'https://app.invalid/auth')),code=q.searchParams.get('code');
 if(!code){toast(t('signInFail'));return}const {error}=await sb.auth.exchangeCodeForSession(code);if(error)toast(t('signInFail'))}
if(CLOUD)sb.auth.onAuthStateChange((ev,session)=>{const was=user;user=session?session.user:null;
 if(/[?&]code=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);
 if(ev==='SIGNED_IN'&&!was&&user){toast(t('signedIn'));setTimeout(()=>loadReports(true),0)}
 if(sheetState==='settings')sheet('settings')});

const NEAR={fuel:['[amenity=fuel]','ti-gas-station'],parking:['[amenity=parking]','ti-parking'],hospital:['[amenity~"^(hospital|clinic)$"]','ti-building-hospital'],atm:['[amenity~"^(atm|bank)$"]','ti-building-bank']};
async function nearby(k){
 const c=me||M.center(),[f,ic]=NEAR[k];hideList();sheet('loading');
 try{const j=await overpass(`[out:json][timeout:15];nwr${f}(around:4000,${c[0]},${c[1]});out center 40;`);
  nearList=j.elements.map(e=>{const lat=e.lat??e.center?.lat,lng=e.lon??e.center?.lon,g=e.tags||{};return{name:g['name:'+S.lang]||g.name||g['name:en']||t(k),addr:[g.brand,g['addr:street']].filter(Boolean).join(' · '),lat,lng,icon:ic,d:lat!=null?dist(c,[lat,lng]):0}}).filter(x=>x.lat!=null).sort((a,b)=>a.d-b.d).slice(0,25);
  M.unmarkers('poi:');nearList.forEach((p,i)=>M.marker('poi:'+i,{ll:[p.lat,p.lng],html:`<div class="poi"><i class="ti ${ic}"></i></div>`,size:[28,28],z:100,onClick:()=>selectPlace(p)}));
  nearKey=k;sheet('nearby');if(nearList.length){follow=false;M.fit(nearList.slice(0,10).map(p=>[p.lat,p.lng]).concat([c]),{top:140,right:40,bottom:$('#sheet').offsetHeight+30,left:40})}
 }catch(e){sheet(null);toast(t('netErr'))}
}

const X='<i class="ti ti-x"></i>';
const SHEETS={
 loading:()=>`<div class="msg">${esc(t('loading'))}</div>`,
 place:()=>{const p=place,fav=P.favs.some(f=>same(f,p));return`<div class="ph"><div><div class="pn">${esc(p.name)}</div><div class="pa">${esc(p.addr)}</div>${me?`<div class="pa">${fmtDist(dist(me,[p.lat,p.lng]))}</div>`:''}</div><button class="ib" data-act="close" aria-label="Close">${X}</button></div>
  <div class="row"><button class="btn pri" data-act="go"><i class="ti ti-navigation"></i>${esc(t('go'))}</button><button class="btn" data-act="fav"><i class="ti ti-star"></i>${esc(fav?t('saved'):t('save'))}</button><button class="btn" data-act="sharePlace" aria-label="Share"><i class="ti ti-share"></i></button></div>
  <div class="row"><button class="lnk" data-act="setHome">${esc(t('setHome'))}</button><button class="lnk" data-act="setWork">${esc(t('setWork'))}</button></div>`},
 routes:()=>`<div class="ph"><div class="h">${esc(dest.name)}</div><button class="ib" data-act="cancelRoute">${X}</button></div><div style="margin-top:10px">${routes.map((r,i)=>`<button class="rt ${i===sel?'sel':''}" data-act="selRoute" data-i="${i}"><div style="flex:1;min-width:0"><b>${fmtDur(r.dur)}</b> <span class="pa">${fmtDist(r.dist)}</span><div class="pa" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.via?esc(t('via')+' '+r.via):''}</div></div>${i===0?`<span class="badge">${esc(t('fastest'))}</span>`:''}</button>`).join('')}</div><div class="row"><button class="btn pri" data-act="start"><i class="ti ti-navigation"></i>${esc(t('start'))}</button><button class="btn" data-act="cancelRoute">${esc(t('cancel'))}</button></div>`,
 nav:()=>`<div class="st"><div><b id="nEta">--</b><small>${esc(t('arrive'))}</small></div><div><b id="nTime">--</b><small>${esc(t('time'))}</small></div><div><b id="nDist">--</b><small>${esc(t('dist'))}</small></div></div><div class="row"><button class="btn" data-act="shareEta" style="flex:1"><i class="ti ti-share"></i>${esc(t('shareEta'))}</button><button class="btn red" data-act="stop"><i class="ti ti-player-stop"></i>${esc(t('stop'))}</button></div>`,
 arrived:()=>`<div class="pn">${esc(t('arrived'))}</div><div class="pa">${esc(dest?dest.name:'')}</div><div class="row"><button class="btn pri" data-act="done">${esc(t('done'))}</button></div>`,
 report:()=>`<div class="ph"><div class="h">${esc(t('report'))}</div><button class="ib" data-act="closeReport">${X}</button></div><div class="grid">${Object.keys(RT).map(k=>`<button class="rb" data-act="addRep" data-k="${k}"><i class="ti ${RT[k][0]}" style="background:${RT[k][1]}"></i>${esc(t(k))}</button>`).join('')}</div>`,
 settings:()=>{const seg=(k,o)=>`<div class="seg">${o.map(([v,l])=>`<button class="${S[k]===v?'on':''}" data-act="set" data-k="${k}" data-v="${v}">${esc(l)}</button>`).join('')}</div>`;return`<div class="ph"><div class="h">${esc(t('settings'))}</div><button class="ib" data-act="close">${X}</button></div>
  <div class="set"><label>${esc(t('lang'))}</label>${seg('lang',[['ar','العربية'],['en','English']])}</div>
  <div class="set"><label>${esc(t('voice'))}</label>${seg('voice',[[true,t('on')],[false,t('off')]])}</div>
  <div class="set"><label>${esc(t('mapView'))}</label>${seg('map3d',[[true,t('m3d')],[false,t('flat')]])}</div>
  <div class="set"><label>${esc(t('night'))}</label>${seg('night',[['auto',t('auto')],['on',t('on')],['off',t('off')]])}</div>
  ${CLOUD?`<div class="set"><label>${esc(t('account'))}</label>${user?`<div class="acct">${user.user_metadata&&user.user_metadata.avatar_url?`<img src="${esc(user.user_metadata.avatar_url)}" alt="" referrerpolicy="no-referrer">`:'<i class="ti ti-user-circle"></i>'}<div><b>${esc((user.user_metadata&&user.user_metadata.full_name)||user.email||'')}</b><small>${esc(user.email||'')}</small></div><button class="btn" data-act="signOut"><i class="ti ti-logout"></i>${esc(t('signOut'))}</button></div>`:`<button class="btn pri" data-act="signIn" style="width:100%"><i class="ti ti-brand-google"></i>${esc(t('signIn'))}</button><div class="pa">${esc(t('signInWhy'))}</div>`}</div>${user?`<div class="set"><label>${esc(t('shareTraffic'))}</label>${seg('share',[[true,t('on')],[false,t('off')]])}</div>`:''}`:''}
  <div class="row">${installEvt?`<button class="btn pri" data-act="install"><i class="ti ti-download"></i>${esc(t('install'))}</button>`:''}<button class="btn" data-act="clearReps"><i class="ti ti-trash"></i>${esc(t('clearReports'))}</button></div>
  <div class="pa" style="margin-top:14px">${esc(t('about'))} ${esc(t(CLOUD?'aboutCloud':'aboutLocal'))}</div>`},
 nearby:()=>`<div class="ph"><div class="h">${esc(t(nearKey))}</div><button class="ib" data-act="closeNear">${X}</button></div>${nearList.length?nearList.map((p,i)=>`<button class="it" data-act="pickNear" data-i="${i}"><i class="ti ${p.icon}"></i><div><b>${esc(p.name)}</b><small>${esc(p.addr)}</small></div><span class="d">${fmtDist(p.d)}</span></button>`).join(''):`<div class="msg">${esc(t('nothingNear'))}</div>`}`
};
function sheet(s){sheetState=s;const el=$('#sheet');if(!s){el.hidden=true;el.innerHTML='';return}el.innerHTML=SHEETS[s]();el.hidden=false;el.scrollTop=0}
function restoreSheet(){if(nav.active){sheet('nav');navUpdate()}else if(prevSheet&&!['report','loading'].includes(prevSheet)&&(prevSheet!=='place'||place)&&(prevSheet!=='routes'||routes.length))sheet(prevSheet);else sheet(null)}
if('ResizeObserver' in window)new ResizeObserver(()=>{const el=$('#sheet');document.documentElement.style.setProperty('--sheet-h',(el.hidden?0:el.offsetHeight)+'px')}).observe($('#sheet'));

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,k=b.dataset.k,i=+b.dataset.i;
 switch(a){
  case 'clearq':qi.value='';b.hidden=true;hideList();break;
  case 'settings':hideList();sheet('settings');break;
  case 'set':{let v=b.dataset.v;if(v==='true')v=true;else if(v==='false')v=false;const was=S[k];S[k]=v;saveS();applyLang();applyTheme();updVol();updateSpeed();sheet('settings');
   if(k==='map3d'&&was!==v)M.start(v).then(n=>{if(v&&n!=='gl')toast(t('no3d'),4500);if(nav.active)followMe()});break}
  case 'close':sheet(null);M.unmarkers('poi:');if(!nav.active&&!routes.length){setDest(null);place=null}break;
  case 'pick':if(list[i])selectPlace(list[i]);break;
  case 'pickNear':if(nearList[i])selectPlace(nearList[i]);break;
  case 'closeNear':M.unmarkers('poi:');sheet(null);break;
  case 'go':if(place)routeTo(place);break;
  case 'fav':toggleFav();break;
  case 'sharePlace':share(place.name,osmUrl(place));break;
  case 'setHome':case 'setWork':P[a==='setHome'?'home':'work']={...place};saveP();toast(t('saved'));break;
  case 'favgo':{const p=P[k];if(!p){toast(t('setHomeFirst'),4500);break}selectPlace(p,false);routeTo(p);break}
  case 'near':nearby(k);break;
  case 'selRoute':sel=i;drawRoutes();sheet('routes');break;
  case 'cancelRoute':routes=[];drawRoutes();sheet(place?'place':null);break;
  case 'start':startNav();break;
  case 'stop':case 'done':endNav(true);break;
  case 'shareEta':{const r=nav.r;if(r&&dest){const rem=Math.max(0,r.total-nav.along);share(t('eta',dest.name,clock(r.dur*rem/r.total)),osmUrl(dest))}break}
  case 'recenter':follow=true;if(!me)toast(t('noGps'));else if(nav.active)followMe();else M.setView(me,Math.max(M.zoom(),16));break;
  case 'north':M.north();break;
  case 'voice':S.voice=!S.voice;saveS();updVol();if(!S.voice){try{speechSynthesis.cancel()}catch(err){}if(TTS)TTS.stop().catch(()=>{})}toast(t('voice')+': '+t(S.voice?'on':'off'));break;
  case 'report':if(sheetState!=='report')prevSheet=sheetState;hideList();sheet('report');break;
  case 'closeReport':restoreSheet();break;
  case 'addRep':addReport(k);restoreSheet();break;
  case 'rmrep':removeReport(b.dataset.id);break;
  case 'signIn':signIn();break;
  case 'signOut':if(sb)sb.auth.signOut().then(()=>toast(t('signedOut')),()=>{});break;
  case 'clearReps':reports=[];LS.set('reports',reports);drawReports();toast(t('removed'));break;
  case 'install':if(installEvt){const ev=installEvt;installEvt=null;ev.prompt();ev.userChoice.finally(()=>{if(sheetState==='settings')sheet('settings')})}break;
 }
},true);

function applyLang(){document.documentElement.lang=S.lang;document.documentElement.dir=AR()?'rtl':'ltr';document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));M.lang(AR());drawReports()}

// PWA: offline app shell + "Install app" button in Settings when the browser offers installation.
let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{installEvt=e;if(sheetState==='settings')sheet('settings')});
window.addEventListener('appinstalled',()=>{installEvt=null;if(sheetState==='settings')sheet('settings')});
if(!NATIVE&&'serviceWorker' in navigator&&window.isSecureContext)navigator.serviceWorker.register('sw.js').catch(()=>{});

// Android app: sign-in return link, and the back button closes panels before leaving the app.
if(APP){APP.addListener('appUrlOpen',e=>finishAppSignIn(e&&e.url));
 APP.addListener('backButton',()=>{if(!$('#results').hidden){hideList();return}
  const c=!$('#sheet').hidden&&$('#sheet [data-act=close],#sheet [data-act=closeNear],#sheet [data-act=closeReport],#sheet [data-act=cancelRoute]');if(c){c.click();return}
  if(sheetState==='arrived'){endNav(true);return}APP.minimizeApp().catch(()=>APP.exitApp())})}
if(CLOUD){M.on('moveend',()=>{loadTraffic(false);loadReports(false)});setInterval(flushTraffic,30000);
 setInterval(()=>{if(document.visibilityState==='visible'){loadTraffic(true);loadReports(true)}},60000);setTimeout(()=>{loadTraffic(true);loadReports(true)},1500)}

M.start(S.map3d!==false).then(n=>{if(S.map3d!==false&&n!=='gl'&&!LS.get('no3dTold',false)){toast(t('no3d'),4500);LS.set('no3dTold',true)}});
applyLang();applyTheme();updVol();startGPS();
if(!LS.get('tip',false)){setTimeout(()=>toast(t('longPress'),4500),1500);LS.set('tip',true)}
</script>
